{% extends 'ideas/idea_list.html' %}

{% block content %}
<div class="devtool-list-group">
    <div class="devtool-list-title">
        <h2>DevTool List</h2>
        <p>개발툴 목록 페이지 입니다. 자신이 사용가능한 개발툴의 목록을 확인해 보세요.</p>
    </div>
    <div class="devtool-list-content">
        {% for tool in devtools %}
            <div class="devtool-item">
                <div class="tool-name">
                    <a href="{% url 'devtools:devtool-detail' tool.pk %}">{{ tool.name }}</a>
                </div>
                <div class="tool-kind">{{ tool.kind }}</div>
                <div class="tool-desc">{{ tool.content }}</div>
            </div>
        {% empty %}
            <div class="no-contents">등록된 개발툴이 없습니다.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
